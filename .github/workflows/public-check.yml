name: public-source-check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile public Python
        run: python -m compileall -q mcp scripts codex-skills
      - name: Audit source and documentation links
        run: python scripts/audit_public_repo.py
