name: solidworks-offline-check
on:
  push:
    paths: ['mcp/solidworks/**', 'mcp/solidworks-drawing/**', 'codex-skills/solidworks-*/**', '.github/workflows/solidworks-check.yml']
  pull_request:
    paths: ['mcp/solidworks/**', 'mcp/solidworks-drawing/**', 'codex-skills/solidworks-*/**', '.github/workflows/solidworks-check.yml']
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: mcp/solidworks/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ./mcp/solidworks -r ./mcp/solidworks-drawing/requirements.txt
      - run: python -m unittest discover -s mcp/solidworks/tests -q
      - run: python -m unittest discover -s mcp/solidworks-drawing/tests -q
      - run: python scripts/audit_public_repo.py
